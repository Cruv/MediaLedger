services:
  db:
    image: postgres:16-alpine
    container_name: medialedger-db-dev
    environment:
      POSTGRES_DB: medialedger
      POSTGRES_USER: medialedger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medialedger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: medialedger-backend-dev
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - DATABASE_URL=postgresql+asyncpg://medialedger:${DB_PASSWORD:-devpassword}@db:5432/medialedger
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - LOG_LEVEL=debug
      - DEBUG=true
    volumes:
      - ./backend:/app
      - ./config/backend:/config
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: medialedger-frontend-dev
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
